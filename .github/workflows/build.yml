# Builds a repository's image for each platform in parallel, each on a
# runner of its own architecture, and joins them into one image on ghcr.io:
#   setup   the platforms as a matrix
#   build   one job per platform, pushed by digest only
#   merge   the digests as one image with its tags
# The caller grants contents: read and, to push, packages: write (README).
name: build

on:
  workflow_call:
    inputs:
      image:
        description: The image without a tag; ghcr.io/<owner>/<repository> in lower case without it.
        type: string
        default: ''
      platforms:
        description: Comma-separated, of linux/amd64 and linux/arm64.
        type: string
        default: linux/amd64,linux/arm64
      context:
        description: The build context, a directory of the repository; the whole repository without it.
        type: string
        default: ''
      file:
        description: The Dockerfile, relative to the context.
        type: string
        default: Dockerfile
      build-args:
        description: One NAME=value a line.
        type: string
        default: ''
      tags:
        description: Tags besides sha-<commit>, one a line; without it latest, and the tag's name for a pushed tag.
        type: string
        default: ''
      push:
        description: false builds without pushing, as for a pull request.
        type: boolean
        default: true
    outputs:
      image:
        description: The image without a tag.
        value: ${{ jobs.setup.outputs.image }}
      digest:
        description: The digest of the pushed image (its index), empty without push.
        value: ${{ jobs.merge.outputs.digest }}

jobs:
  setup:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      image: ${{ steps.matrix.outputs.image }}
    steps:
      # Every input reaches the shell through the environment, never as
      # text of the script.
      - id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms }}
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          image=${IMAGE:-ghcr.io/${GITHUB_REPOSITORY,,}}
          if ! [[ $image =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]; then
            echo "::error::image $image is not a lower-case name on ghcr.io without a tag"
            exit 1
          fi
          include='[]'
          IFS=',' read -ra list <<< "$PLATFORMS"
          for p in "${list[@]}"; do
            p=${p// /}
            case $p in
              linux/amd64) runner=ubuntu-26.04 ;;
              linux/arm64) runner=ubuntu-26.04-arm ;;
              *) echo "::error::platform $p is none of linux/amd64 and linux/arm64"; exit 1 ;;
            esac
            include=$(jq -c --arg p "$p" --arg r "$runner" '. + [{platform: $p, arch: ($p | split("/")[1]), runner: $r}] | unique' <<< "$include")
          done
          [ "$include" != '[]' ] || { echo "::error::no platform"; exit 1; }
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Without a checkout: build-push-action builds the commit of the run
      # from its Git context, a directory of it with context.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context != '' && format('{{{{defaultContext}}}}:{0}', inputs.context) || '' }}
          file: ${{ inputs.file }}
          build-args: ${{ inputs.build-args }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: ${{ inputs.push && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', needs.setup.outputs.image) || 'type=cacheonly' }}
      # Jobs share no files: each digest goes to merge as an artifact.
      - if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir digests && touch "digests/${DIGEST#sha256:}"
      - if: inputs.push
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: inputs.push
    needs: [setup, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: merge
        working-directory: digests
        env:
          IMAGE: ${{ needs.setup.outputs.image }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          tags=("sha-${GITHUB_SHA::7}")
          if [ -n "$TAGS" ]; then
            while IFS= read -r t; do [ -z "$t" ] || tags+=("$t"); done <<< "$TAGS"
          else
            tags+=(latest)
            [ "$GITHUB_REF_TYPE" != tag ] || tags+=("$GITHUB_REF_NAME")
          fi
          args=()
          for t in "${tags[@]}"; do
            # An image tag: letters, digits, _ . - and at most 128 of them.
            if ! [[ $t =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::$t is no image tag"
              exit 1
            fi
            args+=(-t "$IMAGE:$t")
          done
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          echo "digest=$(docker buildx imagetools inspect --raw "$IMAGE:${tags[0]}" | sha256sum | cut -d' ' -f1 | sed 's/^/sha256:/')" >> "$GITHUB_OUTPUT"
